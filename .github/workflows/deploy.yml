name: Deploy BeAurex to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@v5

      - name: Check deployment secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$SSH_HOST" || { echo "SSH_HOST is missing"; exit 1; }
          test -n "$SSH_PORT" || { echo "SSH_PORT is missing"; exit 1; }
          test -n "$SSH_USER" || { echo "SSH_USER is missing"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "SSH_PRIVATE_KEY is missing"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "DEPLOY_PATH is missing"; exit 1; }

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Test Hostinger SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh \
            -i ~/.ssh/hostinger_key \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "echo SSH connection successful"

      - name: Upload latest main branch
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          tar \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude="storage" \
            --exclude="public/uploads" \
            --exclude="vendor" \
            --exclude="node_modules" \
            -czf - . | \
          ssh \
            -i ~/.ssh/hostinger_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_PATH' && tar -xzf - -C '$DEPLOY_PATH'"

      - name: Remove debug scripts and stale caches
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # test_*.php debug scripts were reachable on the live site; old bootstrap caches can
          # point at classes from a previous upload and stop Laravel from starting (blank 500).
          ssh \
            -i ~/.ssh/hostinger_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && rm -f test_*.php public/test_*.php reset_admin.php public/reset_admin.php bootstrap/cache/*.php && mkdir -p public/uploads && chmod -R 775 storage bootstrap/cache public/uploads"

      - name: Install Laravel dependencies
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh \
            -i ~/.ssh/hostinger_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && composer install --no-dev --optimize-autoloader"

      - name: Clear Laravel cache
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh \
            -i ~/.ssh/hostinger_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && php artisan optimize:clear"

      - name: Update database
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Every migration only adds what is missing, so this is safe on the live database.
          ssh \
            -i ~/.ssh/hostinger_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && php artisan migrate --force && php artisan optimize:clear"

      - name: Check the site is up
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://beaurex.in/up)
          echo "https://beaurex.in/up -> $code"
          test "$code" = "200"
